<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link href="/static/pure-min.css" rel="stylesheet">
<link href="/static/app.css" rel="stylesheet">
<script src="/static/jquery-2.1.4.min.js"></script>
<script type="text/javascript" src="/static/cycledirs.js"></script>
</head>
<body>
<a class="pure-button up-button" href="..">Up</a>
<div class="gallery">
	{% for dir in dirs %}
	<div class="item">
		<a href="{{dir.basename()}}/">
			<img class="dirimage" src="/dirthumbnail/{{dir}}" 
				 title="{{dir.basename()}}" />
		</a>
	</div>
	{% end %}

	{% for file in files %}
	<div class="item">
		<a href="/slideshow/{{file.dirname()}}#{{file.basename()}}">
		<img src="/thumbnail/{{file}}" />
		</a>
	</div>
	{% end %}
</div>

</body>
</html>
