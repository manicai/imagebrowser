<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/static/pure-min.css" rel="stylesheet">
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<link href="/static/app.css" rel="stylesheet">
<script src="/static/jquery-3.4.1.min.js"></script>
<script type="text/javascript" src="/static/cycledirs.js"></script>
</head>
<body>
<a class="pure-button up-button" href="..">Up</a>
<div class="gallery">
    {% for dir in dirs %}
    <div class="item">
        <a href="{{dir.name}}/">
            <img class="dirimage" src="/dirthumbnail/{{dir}}"
                 title="{{dir.name}}" />
        </a>
    </div>
    {% end %}

    {% for file in files %}
    <div class="item">
        <a href="/slideshow/{{file.parent}}#{{file.name}}">
        <img src="/thumbnail/{{file}}" />
        </a>
    </div>
    {% end %}

    {% for movie in movies %}
    <div class="item">
        <div>
            <a href="/player/{{movie.path}}">
                <img src="/static/film-solid.svg" style="margin: 10px;"/>
            </a>
        </div>
        <div>
            <i style="text-align: center">{{ movie.name }}</i>
        </div>
    </div>
    {% end %}

    {% for doc in docs %}
    <div class="item">
        <a class="doc-link" href="/doc/{{doc.path}}">
            <img src="/static/document.svg" alt="" />
            <span>{{ doc.name }}</span>
        </a>
    </div>
    {% end %}
</div>

</body>
</html>
