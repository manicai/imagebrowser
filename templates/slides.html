{% autoescape None %}
<html>
<head>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<link href="/static/app.css" rel="stylesheet">
<link href="/static/pure-min.css" rel="stylesheet">
<script type="text/javascript" src="/static/jquery-3.4.1.min.js"></script>
<script type="text/javascript" src="/static/hammer.min.js"></script>
<script type="text/javascript" src="/static/slides.js"></script>
</head>
<body class="slides">
<a class="pure-button" id="close-button" href="/list/{{directory}}/" aria-label="Close slideshow">
<img class="nav-icon" src="/static/icons/close.svg" alt="Close" />
</a>
<button class="pure-button" id="back-button" aria-label="Previous image">
<img class="nav-icon" src="/static/icons/chevron-left.svg" alt="Previous" />
</button>
<img id="slide" />
<button class="pure-button" id="next-button" aria-label="Next image">
<img class="nav-icon" src="/static/icons/chevron-right.svg" alt="Next" />
</button>
</div>

<script type="text/javascript">
var directory = "{{directory}}";
var images = {{imgs}};
</script>
<div class="cache">
 <img id="next" />
 <img id="prev" />
</div>
</body>
</html>
